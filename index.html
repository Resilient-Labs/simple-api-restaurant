<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Recall Tracker</title>

    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <h1>Food Recall Report</h1>
        <section class="firstSection">
            <input id="city" type="text" placeholder="Enter city">
            <input id="date1" type="date">
            <input id="date2" type="date">
            <button id="submit">Submit</button>
        </section>
        
    <section class="resultContainer">
        <h2 class="classType"></h2>
        <h3 class="recommendation"></h3>  
    </section>
    <section class ="reportResults">
        <p class = "productDescription">Product Description:</p>
        <p class = "reasonForRecall">Reason for Recall: </p>
        <p class = "recallDate">Recall Initiation Date: </p>
    </section>
    <script type="text/javascript" src="assets/main.js"></script>
</body>
</html>
